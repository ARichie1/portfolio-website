services:
  - type: web
    name: richard-akinmade-portfolio
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: node build/index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PUBLIC_EMAILJS_SERVICE_ID
        sync: false
      - key: PUBLIC_EMAILJS_TEMPLATE_ID
        sync: false
      - key: PUBLIC_EMAILJS_PUBLIC_KEY
        sync: false

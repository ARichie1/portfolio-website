<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Runs before first paint so there's no flash of the wrong theme.
			// Mirrors the default/persistence logic in src/lib/stores/uiStore.ts —
			// keep both in sync if the storage key or default ever changes.
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					if (stored === 'light') {
						document.documentElement.classList.add('light');
					}
					// dark is the default: no class needed (":root" styles are dark)
				} catch (e) {
					// localStorage unavailable (e.g. private mode) — fall back to dark default
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
